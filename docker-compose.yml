services:
  web:
    build: .
    container_name: medibook_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: medibook_db
    restart: always
    environment:
      POSTGRES_DB: medibook_db
      POSTGRES_USER: medibook_user
      POSTGRES_PASSWORD: medibook_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: