{% extends "base.html" %}

{% block title %}Connexion - MediBook{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow p-4">
      <h3 class="mb-4 text-center">Connexion</h3>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="POST">{% csrf_token %}
        <div class="mb-3"><label class="form-label">Nom d'utilisateur</label><input type="text" name="username" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Mot de passe</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
      </form>
      <hr>
      <p class="text-center mb-1">Pas encore inscrit ? <a href="/register/">Creer un compte</a></p>
      <p class="text-center"><a href="/password-reset/password_reset/">Mot de passe oublie ?</a></p>
    </div>
  </div>
</div>
{% endblock %}
