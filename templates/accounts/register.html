<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2>Inscription Patient</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" class="form-control mt-2" placeholder="Username">

        <input type="email" name="email" class="form-control mt-2" placeholder="Email">

        <input type="password" name="password" class="form-control mt-2" placeholder="Password">

        <button class="btn btn-success mt-3">Register</button>
    </form>
</div>

</body>
</html>
