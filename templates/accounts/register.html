{% extends "base.html" %}

{% block title %}Inscription - MediBook{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow p-4">
      <h3 class="mb-4 text-center">Creer un compte patient</h3>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="POST">{% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Prenom</label><input type="text" name="first_name" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Nom</label><input type="text" name="last_name" class="form-control"></div>
          <div class="col-12"><label class="form-label">Nom d'utilisateur *</label><input type="text" name="username" class="form-control" required></div>
          <div class="col-12"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Mot de passe *</label><input type="password" name="password" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Confirmer *</label><input type="password" name="password2" class="form-control" required></div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-3">S'inscrire</button>
      </form>
      <p class="text-center mt-3">Deja inscrit ? <a href="/login/">Connexion</a></p>
    </div>
  </div>
</div>
{% endblock %}
