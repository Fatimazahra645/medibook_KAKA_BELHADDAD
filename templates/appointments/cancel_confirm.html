<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Annuler le rendez-vous - MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width:500px">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title text-danger">Annuler le rendez-vous</h4>
            <p>Vous êtes sur le point d'annuler votre rendez-vous :</p>
            <ul>
                <li><strong>Date :</strong> {{ appointment.date|date:"d/m/Y" }}</li>
                <li><strong>Heure :</strong> {{ appointment.time|time:"H:i" }}</li>
                <li><strong>Médecin :</strong> Dr. {{ appointment.doctor.user.first_name }} {{ appointment.doctor.user.last_name }}</li>
            </ul>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirmer l'annulation</button>
                <a href="/dashboard/patient/" class="btn btn-secondary ms-2">Retour</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
