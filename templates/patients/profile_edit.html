{% extends "base.html" %}

{% block title %}Mon profil - MediBook{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow p-4">
      <h3 class="mb-4">Modifier mon profil</h3>
      <form method="POST">{% csrf_token %}
        {% for field in form %}<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Enregistrer</button><a href="/dashboard/patient/" class="btn btn-outline-secondary">Annuler</a></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
