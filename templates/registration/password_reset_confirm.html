{% extends "base.html" %}

{% block title %}Nouveau mot de passe - MediBook{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow p-4">
  <h4>Nouveau mot de passe</h4>
  {% if validlink %}<form method="POST">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary w-100">Confirmer</button></form>
  {% else %}<div class="alert alert-danger">Lien invalide ou expire. <a href="/password-reset/password_reset/">Reessayer</a></div>{% endif %}
</div></div></div>
{% endblock %}
