{% extends "base.html" %}

{% block title %}Reinitialiser mot de passe - MediBook{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow p-4">
  <h4>Mot de passe oublie</h4><p class="text-muted small">Entrez votre email pour recevoir un lien de reinitialisation.</p>
  <form method="POST">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary w-100">Envoyer</button></form>
</div></div></div>
{% endblock %}
