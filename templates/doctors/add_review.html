<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Médecins - MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/">🏥 MediBook</a>
    <div class="d-flex gap-2">
        <a href="/ai/" class="btn btn-warning btn-sm">🤖 Orientation IA</a>
        {% if user.is_authenticated %}
            <a href="/dashboard/patient/" class="btn btn-light btn-sm">Mon espace</a>
            <a href="/logout/" class="btn btn-outline-light btn-sm">Déconnexion</a>
        {% else %}
            <a href="/login/" class="btn btn-light btn-sm">Connexion</a>
            <a href="/register/" class="btn btn-warning btn-sm">Inscription</a>
        {% endif %}
    </div>
</nav>
<div class="container mt-5">

    <h2>
        Avis sur Dr.
        {{ doctor.user.first_name }}
        {{ doctor.user.last_name }}
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            class="btn btn-primary"
            type="submit"
        >
            Envoyer
        </button>

    </form>

</div>

</body>
</html>
