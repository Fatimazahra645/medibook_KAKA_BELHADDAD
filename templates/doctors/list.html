<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2>Liste des médecins</h2>

    <div class="row">
        {% for doctor in doctors %}
        <div class="col-md-4 mt-3">
            <div class="card p-3">
                <h5>{{ doctor.user.username }}</h5>
                <p>{{ doctor.speciality.name }}</p>
                <p>{{ doctor.phone }}</p>

                <a href="/appointments/book/{{ doctor.id }}" class="btn btn-primary">Réserver</a>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
