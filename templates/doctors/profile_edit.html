{% extends "base.html" %}

{% block title %}Modifier mon profil medecin - MediBook{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow p-4">
      <h3 class="mb-4">Modifier mon profil</h3>
      <form method="POST" enctype="multipart/form-data">{% csrf_token %}
        {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Enregistrer</button><a href="/dashboard/doctor/" class="btn btn-outline-secondary">Annuler</a></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
