name: CI/CD MediBook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: medibook
          POSTGRES_USER: medibook
          POSTGRES_PASSWORD: medibook
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medibook"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: sleep 10

      - name: Run migrations
        env:
          DATABASE_URL: postgres://medibook:medibook@localhost:5432/medibook
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://medibook:medibook@localhost:5432/medibook
        run: |
          python manage.py test -v 2