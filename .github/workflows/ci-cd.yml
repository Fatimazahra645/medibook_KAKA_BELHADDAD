name: CI/CD MediBook
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: medibook
          POSTGRES_USER: medibook
          POSTGRES_PASSWORD: medibook
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medibook"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt flake8
      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --exclude=migrations,__pycache__ --count || true
      - name: Migrate & test
        env:
          DB_NAME: medibook
          DB_USER: medibook
          DB_PASSWORD: medibook
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ci-test-secret-key-medibook
          DEBUG: "True"
        run: |
          python manage.py migrate
          python manage.py test -v 2

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/medibook:latest
